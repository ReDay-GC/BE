spring:
  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  data:
    web:
      pageable:
        default-page-size: 20

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000   # 24h

internal:
  api-key: ${INTERNAL_API_KEY}

openai:
  api:
    key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com/v1

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME}
    region:
      static: ap-northeast-2

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true
