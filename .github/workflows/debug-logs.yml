name: Debug - Docker Logs

on:
  workflow_dispatch:

jobs:
  get-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Get Docker logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== AnalysisAiService 관련 로그 ==="
            docker logs reday 2>&1 | grep -A 10 "AnalysisAiService"
            echo "=== 최근 ERROR/WARN 로그 ==="
            docker logs reday 2>&1 | grep -E "ERROR|WARN" | tail -20
