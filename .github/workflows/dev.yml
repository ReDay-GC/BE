name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image to Docker Hub
        run: |
          docker build -t jinsung0927/reday:latest .
          docker push jinsung0927/reday:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_HOST,DB_NAME,DB_USERNAME,DB_PASSWORD,S3_BUCKET_NAME,JWT_SECRET,OPENAI_API_KEY
          script: |
            docker pull jinsung0927/reday:latest
            docker stop reday || true
            docker rm reday || true
            docker run -d \
              --name reday \
              --restart unless-stopped \
              -p 8080:8080 \
              -e "SPRING_PROFILES_ACTIVE=dev" \
              -e "SWAGGER_SERVER_URL=http://${{ secrets.EC2_HOST }}:8080" \
              -e "DB_HOST=$DB_HOST" \
              -e "DB_NAME=$DB_NAME" \
              -e "DB_USERNAME=$DB_USERNAME" \
              -e "DB_PASSWORD=$DB_PASSWORD" \
              -e "S3_BUCKET_NAME=$S3_BUCKET_NAME" \
              -e "JWT_SECRET=$JWT_SECRET" \
              -e "OPENAI_API_KEY=$OPENAI_API_KEY" \
              jinsung0927/reday:latest

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in {1..30}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for app to start... ($i/30)"
              sleep 10
            done
            echo "Health check failed"
            exit 1
